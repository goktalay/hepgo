<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MASTERWORLD">
  <defs>
    <linearGradient id="mwbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a33"/>
      <stop offset="1" stop-color="#03060e"/>
    </linearGradient>
    <radialGradient id="mwsea" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#2f8cff"/>
      <stop offset="0.55" stop-color="#0f3f86"/>
      <stop offset="1" stop-color="#061a3d"/>
    </radialGradient>
    <radialGradient id="mwglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.80" stop-color="#3fd0ff" stop-opacity="0"/>
      <stop offset="0.90" stop-color="#3fd0ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3fd0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mwshade" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="mworbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <clipPath id="mwfront"><rect x="0" y="256" width="512" height="256"/></clipPath>
    <clipPath id="mwclip"><circle cx="256" cy="256" r="150"/></clipPath>
    <filter id="mwsoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#mwbg)"/>
  <!-- yıldızlar -->
  <g fill="#cfe6ff">
    <circle cx="78" cy="96" r="2.4" opacity="0.8"/><circle cx="430" cy="70" r="2" opacity="0.7"/><circle cx="452" cy="300" r="1.8" opacity="0.6"/>
    <circle cx="60" cy="350" r="1.6" opacity="0.5"/><circle cx="392" cy="452" r="2.2" opacity="0.6"/><circle cx="130" cy="452" r="1.4" opacity="0.5"/>
  </g>
  <!-- yörüngenin arka yarısı -->
  <g transform="rotate(-24 256 256)">
    <ellipse cx="256" cy="256" rx="214" ry="66" fill="none" stroke="#ffb347" stroke-opacity="0.45" stroke-width="5"/>
  </g>
  <!-- atmosfer halesi -->
  <circle cx="256" cy="256" r="182" fill="url(#mwglow)"/>
  <!-- küre -->
  <circle cx="256" cy="256" r="150" fill="url(#mwsea)"/>
  <g clip-path="url(#mwclip)">
    <!-- kıtalar (sadeleştirilmiş) -->
    <g fill="#35d6a8" opacity="0.92">
      <path d="M150 168 C176 140 222 136 246 150 C262 160 252 180 232 186 C214 192 222 212 206 224 C190 236 170 230 160 214 C146 196 136 184 150 168 Z"/>
      <path d="M214 246 C236 238 258 248 262 270 C266 292 254 318 240 346 C230 366 214 372 208 352 C202 330 200 306 196 284 C192 264 198 252 214 246 Z"/>
      <path d="M286 150 C314 136 360 146 384 172 C400 190 396 212 376 216 C356 220 344 206 324 214 C304 222 290 210 288 192 C286 176 272 160 286 150 Z"/>
      <path d="M318 236 C342 228 372 238 384 262 C394 284 380 306 356 312 C334 318 318 304 312 284 C306 264 300 244 318 236 Z"/>
      <path d="M360 334 C376 328 396 336 398 352 C400 366 384 374 368 370 C352 366 346 342 360 334 Z"/>
    </g>
    <!-- meridyen / paralel ızgarası -->
    <g fill="none" stroke="#9fe3ff" stroke-opacity="0.32" stroke-width="2.2">
      <ellipse cx="256" cy="256" rx="150" ry="52"/>
      <ellipse cx="256" cy="256" rx="150" ry="104"/>
      <path d="M106 256 H406"/>
      <ellipse cx="256" cy="256" rx="54" ry="150"/>
      <ellipse cx="256" cy="256" rx="108" ry="150"/>
      <path d="M256 106 V406"/>
    </g>
    <circle cx="256" cy="256" r="150" fill="url(#mwshade)"/>
  </g>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#7fdcff" stroke-opacity="0.55" stroke-width="3"/>
  <!-- canlı veri noktaları (uçak, deprem, kamera) -->
  <g filter="url(#mwsoft)">
    <circle cx="198" cy="180" r="7" fill="#ffd27a"/>
    <circle cx="340" cy="262" r="7" fill="#ff6b6b"/>
    <circle cx="232" cy="300" r="6" fill="#ffd27a"/>
  </g>
  <circle cx="340" cy="262" r="16" fill="none" stroke="#ff6b6b" stroke-width="3" opacity="0.7"/>
  <circle cx="340" cy="262" r="27" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.35"/>
  <!-- yörüngenin ön yarısı (arka yarısı kürenin arkasında) + uydu -->
  <g transform="rotate(-24 256 256)">
    <ellipse cx="256" cy="256" rx="214" ry="66" fill="none" stroke="url(#mworbit)" stroke-width="7" clip-path="url(#mwfront)"/>
    <g transform="translate(468 262)" filter="url(#mwsoft)">
      <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#ffd27a"/>
      <rect x="-34" y="-5" width="20" height="10" rx="2" fill="#7fdcff"/>
      <rect x="14" y="-5" width="20" height="10" rx="2" fill="#7fdcff"/>
    </g>
  </g>
</svg>
