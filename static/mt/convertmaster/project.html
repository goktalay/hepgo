<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Convert Master</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="../common/hepgo.css">
  <link rel="stylesheet" href="mastertool.css">
  <link rel="stylesheet" href="form.css">
  <link rel="stylesheet" href="project.css">
</head>
<body>
  <div class="pj">
    <header class="pj-bar">
      <span class="pj-avatar" id="pjAvatar"></span>
      <div class="pj-title">
        <div class="pj-name-row"><span class="pj-name" id="pjName"></span><span class="pj-conv" id="pjConv"></span></div>
        <div class="pj-src" id="pjSrc"></div>
      </div>
      <div class="bar-actions">
        <button class="btn sm ghost" id="btnSource"></button>
        <span class="bar-sep"></span>
        <button class="btn primary run-btn" id="btnRun"></button>
        <button class="icon-btn" id="btnOutDir"></button>
        <button class="icon-btn" id="btnExport"></button>
        <button class="icon-btn" id="btnClear"></button>
        <button class="icon-btn" id="btnSettings"></button>
        <button class="icon-btn" id="btnTheme"></button>
      </div>
    </header>

    <section class="preview" id="preview">
      <div class="pv" data-which="src">
        <div class="pv-head"><span class="pv-label" data-t="pj.original"></span><span class="pv-name"></span><span class="pv-info"></span></div>
        <div class="pv-body"></div>
      </div>
      <button class="pv-link" id="pvLink"></button>
      <div class="pv" data-which="out">
        <div class="pv-head"><span class="pv-label" data-t="pj.converted"></span><span class="pv-name"></span><span class="pv-info"></span></div>
        <div class="pv-body"></div>
      </div>
    </section>
    <div class="hsplit" id="splitPreview"></div>

    <div class="pj-body" id="body">
      <aside class="col tree-col" id="treeCol">
        <div class="panel-head">
          <span class="panel-ico" id="icoTree"></span>
          <span class="panel-title" data-t="pj.folders"></span>
          <div class="panel-actions">
            <button class="icon-btn" data-a="expand"></button>
            <button class="icon-btn" data-a="collapse"></button>
            <button class="icon-btn" data-a="refresh"></button>
          </div>
        </div>
        <div class="vlist tree" id="tree" tabindex="0"><div class="vspacer"></div><div class="vrows"></div></div>
      </aside>
      <div class="vsplit" id="splitTree"></div>

      <section class="col list-col" id="listCol">
        <div class="panel-head">
          <span class="panel-ico" id="icoList"></span>
          <span class="panel-title"><span data-t="pj.files"></span> <span class="count" id="listCount"></span></span>
          <div class="list-filter"><span class="lf-ico" id="lfIco"></span><input id="listFilter" spellcheck="false"></div>
          <select class="input sm" id="statusFilter"></select>
        </div>
        <div class="list-head" id="listHead"></div>
        <div class="vlist list" id="list" tabindex="0"><div class="vspacer"></div><div class="vrows"></div></div>
        <div class="single hidden" id="single"></div>
        <div class="no-source hidden" id="noSource"></div>
      </section>
      <div class="vsplit" id="splitTr"></div>

      <aside class="col tr-col" id="trCol">
        <div class="panel-head">
          <span class="panel-ico" id="icoTr"></span>
          <span class="panel-title" data-t="pj.transcript"></span>
          <div class="panel-actions">
            <button class="icon-btn" data-a="transcribe"></button>
            <button class="icon-btn" data-a="export"></button>
          </div>
        </div>
        <div class="dl-bar hidden" id="dlBar"></div>
        <div class="tr-head"><span data-t="pj.trSecond"></span><span data-t="pj.trLang"></span><span data-t="pj.trText"></span></div>
        <div class="tr-body" id="trBody"></div>
      </aside>
    </div>

    <footer class="status-bar">
      <span id="stTotal"></span>
      <span class="sep"></span>
      <span id="stDone"></span>
      <span id="stErr"></span>
      <span id="stActive"></span>
      <span class="overall"><span class="progress"><div id="stBar"></div></span><span id="stPct"></span></span>
      <span class="grow"></span>
      <span id="stOut"></span>
      <button class="limit-chip" id="stConc"></button>
    </footer>
  </div>

  <script src="../common/hepgo.js"></script>
  <script src="bridge.js"></script>
  <script src="i18n.js"></script>
  <script src="formats.js"></script>
  <script src="ui.js"></script>
  <script src="settings.js"></script>
  <script src="mastertool.js"></script>
  <script src="projectform.js"></script>
  <script src="project.js"></script>
</body>
</html>
