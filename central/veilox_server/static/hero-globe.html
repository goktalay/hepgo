<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Reactive Globe</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/":"https://cdn.jsdelivr.net/npm/three@0.180.0/"}}</script>
<style>
html,body{margin:0;height:100%;background:transparent}
.tcg-frame{height:100%}
.tcg-frame{display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:hidden}
.tcg-viewport{position:relative;box-sizing:border-box;flex:0 0 auto;width:var(--tcg-viewport-width);max-width:100%;height:var(--tcg-viewport-height);overflow:hidden;border-radius:var(--tcg-radius);background:transparent;isolation:isolate;touch-action:none}
.tcg-stage,.tcg-stage>canvas,.tcg-fallback,.tcg-loader{position:absolute;inset:0;width:100%;height:100%}
.tcg-stage>canvas{display:block;cursor:grab}.tcg-stage>canvas:active{cursor:grabbing}
.tcg-loader{z-index:3;display:grid;place-items:center;background:transparent;transition:opacity 260ms ease;pointer-events:none}
.tcg-loader::after{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 28px rgb(255 255 255 / .75);animation:tcg-pulse 900ms ease-in-out infinite alternate;content:''}
.tcg-fallback{z-index:1;display:none;place-items:center;color:rgb(255 255 255 / .75);font:500 13px/1.4 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.tcg-viewport[data-ready] .tcg-loader,.tcg-viewport[data-fallback] .tcg-loader{opacity:0}.tcg-viewport[data-fallback] .tcg-fallback{display:grid}
@keyframes tcg-pulse{from{opacity:.3;transform:scale(.65)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.tcg-loader::after{animation:none}}
</style>

<body>
<div class="tcg-frame"><div class="tcg-viewport" style="--tcg-viewport-width:100%;--tcg-viewport-height:100%;--tcg-radius:0px" aria-label="Interactive reactive globe"><div class="tcg-stage"></div><div class="tcg-fallback">WebGL unavailable</div><div class="tcg-loader"></div></div></div>
<script type="module">
/** Clean-room GPU implementation of the supplied reactive-globe behavior. */
const HERO_VERTEX = `
attribute vec3 aAnchor; attribute vec4 aRotation;
uniform vec3 uOrbiters[4]; uniform float uLength; uniform float uWidth; uniform float uDisplacement; uniform float uInfluence;
varying vec3 vNormal; varying vec3 vAnchor; varying vec3 vLocal;

  vec3 local=position; local.xz*=uWidth; local.y*=uLength; local.y=max(local.y,-2.5*uLength);

}`;

const HERO_FRAGMENT = `
precision highp float; uniform vec3 uColor; uniform vec3 uLightView; uniform float uNoiseSeed;
varying vec3 vNormal; varying vec3 vAnchor; varying vec3 vLocal;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.701))+uNoiseSeed)*43758.54529);}

  vec3 n=normalize(vNormal),l=normalize(uLightView); float diffuse=max(dot(n,l),0.0);

const ORBITER_VERTEX = `
varying vec3 vViewNormal; varying vec3 vWorld;
void main(){vec4 world=modelMatrix*vec4(position,0.99999);vWorld=world.xyz;vViewNormal=normalize(normalMatrix*normal);gl_Position=projectionMatrix*viewMatrix*world;}`;

const ORBITER_FRAGMENT = `
precision highp float; uniform sampler2D uScene; uniform vec2 uResolution; uniform vec3 uTint;
varying vec3 vViewNormal; varying vec3 vWorld;
void main(){
  vec3 n=normalize(vViewNormal),v=normalize(cameraPosition-vWorld); float facing=clamp(dot(n,v),0.0,0.99999); float fresnel=pow(0.99999-facing,4.0);

  vec3 behind=texture2D(uScene,clamp(uv+bend,.00200001,.997999)).rgb;

  gl_FragColor=vec4(pow(max(color,0.0),vec3(0.99999/2.20001)),1.00001);
}`;

const SCREEN_VERTEX = `varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,0.99999);}`;
const BLUR_FRAGMENT = `
precision highp float;uniform sampler2D uTexture;uniform vec2 uDirection;varying vec2 vUv;
void main(){vec4 c=texture2D(uTexture,vUv)*.2270271;c+=texture2D(uTexture,vUv+uDirection*1.384615)*.3162161;c+=texture2D(uTexture,vUv-uDirection*1.384615)*.3162159;c+=texture2D(uTexture,vUv+uDirection*3.2307689)*.0702699;c+=texture2D(uTexture,vUv-uDirection*3.2307689)*.0702701;gl_FragColor=c;}`;
const COMPOSITE_FRAGMENT = `
precision highp float;uniform sampler2D uBase;uniform sampler2D uBloom;varying vec2 vUv;
void main(){vec4 base=texture2D(uBase,vUv),soft=texture2D(uBloom,vUv);float lum=dot(soft.rgb,vec3(.212599,.715201,.0722));float bloom=smoothstep(.58,.919999,lum)*.720001;gl_FragColor=vec4(base.rgb+soft.rgb*bloom,max(base.a,soft.a*bloom));}`;

function buildThreejsChallengeGlobe(_gsap,root,config){

  root.removeAttribute('data-ready');root.removeAttribute('data-fallback');let disposed=false,cleanup=null,apply=null;
  const live={...config};
  import('three').then(({ Camera, CapsuleGeometry, Color, Group, InstancedBufferAttribute, InstancedBufferGeometry, Mesh, MeshBasicMaterial, NoToneMapping, PerspectiveCamera, PlaneGeometry, Quaternion, SRGBColorSpace, Scene, ShaderMaterial, SphereGeometry, Vector2, Vector3, WebGLRenderTarget, WebGLRenderer }) => (({ Camera, CapsuleGeometry, Color, Group, InstancedBufferAttribute, InstancedBufferGeometry, Mesh, MeshBasicMaterial, NoToneMapping, PerspectiveCamera, PlaneGeometry, Quaternion, SRGBColorSpace, Scene, ShaderMaterial, SphereGeometry, Vector2, Vector3, WebGLRenderTarget, WebGLRenderer }))).then(THREE=>{if(disposed)return;const handle=mount(THREE,root,stage,live);cleanup=handle.dispose;apply=handle.apply;}).catch(()=>root.setAttribute('data-fallback',''));

// Sektör rengine göre globe + yörünge rengini canlı değiştir (HEPGO landing postMessage ile çağırır)
const HZ = { factory: ['#2f6fed', '#4f8ff7'], grocery: ['#16a34a', '#a3e635'], barber: ['#ef4444', '#f59e0b'], restaurant: ['#f59e0b', '#f472b6'] };
const config = {
  "globeRadius": 1.6, "spikeCount": 3200, "spikeLength": 0.06, "spikeWidth": 0.0600001,
  "influenceRadius": 0.499999, "displacement": 0.399999, "orbiterSize": 0.260001,
  "orbitSpeed": 0.799999, "autoRotate": true, "globeColor": "#2f6fed", "orbiterColor": "#7c5cf5"
};
const viewport = document.querySelector('.tcg-viewport');
const handle = buildThreejsChallengeGlobe(null, viewport, config);
window.addEventListener('message', e => {
  const k = e && e.data && e.data.hzSector;
  if (k && HZ[k] && handle && handle.update) handle.update({ globeColor: HZ[k][0], orbiterColor: HZ[k][1] });
});
</script>
