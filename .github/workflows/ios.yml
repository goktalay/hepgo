name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode 26+ (Apple iOS 26 SDK şartı)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS bağımlılıkları + iOS sync
        working-directory: mobile
        run: |
          npm ci
          npx cap sync ios

      - name: fastlane güncelle (altool + API key düzeltmesi 2.240+)
        run: sudo gem install fastlane -N

      - name: Sürümleri göster
        run: |
          xcodebuild -version
          ruby --version
          fastlane --version | tail -2
          pod --version

      - name: CocoaPods
        working-directory: mobile/ios/App
        run: pod install

      - name: Derle ve TestFlight'a yükle
        working-directory: mobile/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_READONLY: 'false'
        run: fastlane ios beta
